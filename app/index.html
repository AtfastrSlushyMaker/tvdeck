<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>TVDeck</title>
  <link rel="icon" href="img/favicon-64.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="booting">
  <!-- Color wash taken from the focused tile's icon; two layers cross-fade. -->
  <div class="backdrop" aria-hidden="true">
    <canvas class="wash" width="16" height="9"></canvas>
    <canvas class="wash" width="16" height="9"></canvas>
    <div class="backdrop-shade"></div>
  </div>

  <!-- Loading mark: shown only when the first load is slow. -->
  <div class="splash" aria-hidden="true"><img src="img/mark-256.png" alt=""></div>

  <!-- Fixed top bar: quick access on the left, time and status on the right. -->
  <header class="topbar">
    <nav class="nav" id="nav">
      <img class="nav-brand" src="img/mark-256.png" alt="TVDeck">
      <div class="nav-btn" data-nav="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></div>
      <div class="nav-btn" data-nav="phone"><span class="nav-icon" data-icon="phone"></span><span>Send from phone</span></div>
    </nav>
    <div class="shelf-status">
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date"></div>
      <div class="weather" id="weather" hidden>
        <span id="weather-temp" class="weather-temp"></span>
        <span id="weather-label" class="weather-label"></span>
      </div>
      <div id="ticker" class="ticker"></div>
    </div>
  </header>

  <div class="viewport">
    <div id="page" class="page">
      <header class="shelf">
        <div class="shelf-info">
          <div id="shelf-kind" class="shelf-kind"></div>
          <h1 id="shelf-title" class="shelf-title"></h1>
          <div id="shelf-meta" class="shelf-meta"></div>
        </div>
      </header>
      <main id="rows" class="rows"></main>
    </div>
  </div>

  <section id="ambient" class="ambient" hidden>
    <div class="ambient-content">
      <div id="ambient-clock" class="ambient-clock"></div>
      <div id="ambient-date" class="ambient-date"></div>
      <div id="ambient-line" class="ambient-line"></div>
    </div>
  </section>

  <div class="topfade" aria-hidden="true"></div>
  <div class="bottomfade" aria-hidden="true"></div>
  <footer class="hints" id="hints"></footer>

  <div id="toast" class="toast" role="status"></div>

  <section id="settings" class="settings" hidden>
    <div class="settings-side">
      <div class="settings-glyph" id="settings-glyph"></div>
      <h2 id="settings-title">Settings</h2>
      <p id="settings-subtitle">TVDeck</p>
    </div>
    <div class="settings-panel">
      <div id="settings-list" class="settings-list"></div>
    </div>
  </section>

  <section id="overlay" class="overlay" hidden>
    <div id="overlay-card" class="overlay-card"></div>
  </section>

  <script src="vendor/qrcode.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/store.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/launcher.js"></script>
</body>
</html>
